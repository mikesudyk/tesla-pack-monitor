[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-bms"
version = "0.1.0"
description = "Classic Tesla Model S/X BMS data model and CAN decoder"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-can>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
tpm = "tesla_bms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
